name: tests

on:
  pull_request:
  push:
    branches: [main]

env:
  DRIVER_KEY: github-actions
  DRIVER_PASSWORD: github-actions
  DRIVER_TOKEN: github-actions
  DRIVER_USER_ID: github-actions
  TOX_PARALLEL_NO_SPINNER: 1

jobs:
  tox:
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.7"
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Set up Python ${{ matrix.python-version }}
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
            .tox
            .mypy_cache
            .coverage
          key: ${{ runner.os }}-${{ matrix.python-version }}-${{ env.pythonLocation }}-pip-${{ hashFiles('**/requirements-tox.txt') }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --progress-bar off tox tox-gh-actions
      - name: Run all envs
        run: tox -p auto
